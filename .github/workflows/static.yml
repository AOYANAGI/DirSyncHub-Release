name: Deploy docs/api to GitHub Pages

on:
  push:
    branches: [ "main" ]
    paths:
      - "docs/api/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      # リポジトリを取得する
      - name: Checkout
        uses: actions/checkout@v4

      # Pages設定を初期化する
      - name: Setup Pages
        uses: actions/configure-pages@v5

      # docs フォルダを公開アーティファクトとしてアップロードする
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./docs"

      # GitHub Pagesへデプロイする
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
